<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kala AppStore - Free Mobile & PC Apps Download</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #00f2fe;
            --accent-hover: #4facfe;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --danger: #ff4d4d;
            --success: #2ea44f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            background-color: #010409;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .search-container i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Layout */
        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        /* Banner Ad Placeholder */
        .ad-banner {
            background-color: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        /* Filter Tabs */
        .category-tabs {
            display: flex;
            gap: 0.8rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            font-weight: 600;
        }

        /* Apps Grid */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .app-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            background-color: #000;
        }

        .app-info {
            flex: 1;
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            color: var(--text-main);
        }

        .app-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .badge {
            background-color: rgba(0, 242, 254, 0.1);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .app-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .app-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 0.8rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #000;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Modal / Popups */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Countdown Box */
        .download-box {
            text-align: center;
            padding: 1.5rem 0;
        }

        .timer-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-color);
            margin: 1rem auto;
            border: 2px solid var(--accent-color);
        }

        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="navbar">
            <a href="#" class="logo">
                <div class="logo-icon"><i class="fas fa-cubes"></i></div>
                Kala <span>AppStore</span>
            </a>
            
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search Apps, Games..." onkeyup="filterApps()">
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <div class="main-container">

        <!-- Top Ad Space -->
        <div class="ad-banner">
            <p><i class="fas fa-ad"></i> Ad Space - Banner Code Here</p>
        </div>

        <!-- Categories Filter -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', event)"><i class="fas fa-th-large"></i> All Apps</button>
            <button class="tab-btn" onclick="filterCategory('android', event)"><i class="fab fa-android"></i> Android Apps</button>
            <button class="tab-btn" onclick="filterCategory('pc', event)"><i class="fab fa-windows"></i> PC / Windows</button>
            <button class="tab-btn" onclick="filterCategory('games', event)"><i class="fas fa-gamepad"></i> Games</button>
        </div>

        <!-- Apps List Grid -->
        <div class="apps-grid" id="appsGrid">
            <!-- App Cards dynamically loaded -->
        </div>
    </div>

    <!-- Direct Download Modal with Timer -->
    <div class="modal-overlay" id="downloadModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('downloadModal')">&times;</button>
            <div id="modalAppDetails" class="app-header" style="margin-bottom: 1rem;">
                <!-- Dynamic Header -->
            </div>

            <div class="ad-banner" style="padding: 0.8rem; font-size: 0.8rem; margin-bottom: 1rem;">
                <p><i class="fas fa-ad"></i> Sponsored Ad Banner</p>
            </div>

            <div class="download-box">
                <p id="downloadStatusText" style="color: var(--text-muted);">Preparing direct download from server...</p>
                <div class="timer-circle" id="timerCount">5</div>
                
                <a id="finalDownloadBtn" href="#" download class="btn btn-primary" style="display: none; width: 100%; justify-content: center; padding: 1rem;">
                    <i class="fas fa-download"></i> Direct Download Now
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Kala AppStore. Direct Software & Mobile Downloads.</p>
    </footer>

    <script>
        // এখানে আপনার ওয়েবসাইটের ফাইল ও ছবির নাম যোগ করবেন
        let appsData = [
            {
                id: 1,
                name: "CapCut Video Editor",
                category: "android",
                icon: "./capcut.png", // আপনার সাইটের ছবি
                size: "110 MB",
                version: "v11.0.0",
                desc: "Official CapCut Video Editor APK for Android devices.",
                downloadUrl: "./capcut.apk" // সরাসরি সাইট থেকে ডাউনলোড ফাইল
            }
        ];

        let currentCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            renderApps();
        });

        function renderApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';

            const filteredApps = appsData.filter(app => {
                return (currentCategory === 'all' || app.category === currentCategory);
            });

            if (filteredApps.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">No apps found.</div>`;
                return;
            }

            filteredApps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div>
                        <div class="app-header">
                            <img src="${app.icon}" alt="${app.name}" class="app-icon" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="app-info">
                                <h3 class="app-title">${app.name}</h3>
                                <span class="badge">${app.category}</span>
                                <div class="app-meta"><i class="fas fa-hdd"></i> ${app.size}</div>
                            </div>
                        </div>
                        <p class="app-desc">${app.desc}</p>
                    </div>
                    <div class="app-footer">
                        <span style="font-size: 0.8rem; color: var(--text-muted);">${app.version}</span>
                        <button class="btn btn-primary" onclick="triggerDownload(${app.id})">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, event) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
            renderApps();
        }

        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.app-card');

            cards.forEach(card => {
                const title = card.querySelector('.app-title').innerText.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function triggerDownload(appId) {
            const app = appsData.find(a => a.id === appId);
            if (!app) return;

            const modal = document.getElementById('downloadModal');
            const detailsContainer = document.getElementById('modalAppDetails');
            const timerCount = document.getElementById('timerCount');
            const statusText = document.getElementById('downloadStatusText');
            const downloadBtn = document.getElementById('finalDownloadBtn');

            detailsContainer.innerHTML = `
                <img src="${app.icon}" class="app-icon" onerror="this.src='https://via.placeholder.com/150'">
                <div class="app-info">
                    <h3 class="app-title">${app.name}</h3>
                    <div class="app-meta"><i class="fas fa-file-archive"></i> ${app.size} | Platform: ${app.category.toUpperCase()}</div>
                </div>
            `;

            let timeLeft = 5;
            timerCount.innerText = timeLeft;
            timerCount.style.display = 'flex';
            downloadBtn.style.display = 'none';
            statusText.innerText = "Please wait, starting direct download...";

            modal.style.display = 'flex';

            const countdown = setInterval(() => {
                timeLeft--;
                timerCount.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerCount.style.display = 'none';
                    statusText.innerText = "Click below to download directly!";
                    downloadBtn.href = app.downloadUrl;
                    downloadBtn.setAttribute("download", app.name);
                    downloadBtn.style.display = 'inline-flex';
                }
            }, 1000);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>
</body>
</html>
